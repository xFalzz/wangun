services:
  postgres:
    # pgvector: PostgreSQL dengan ekstensi vector untuk Memory/RAG (Blueprint §9)
    image: pgvector/pgvector:pg16
    container_name: wangun_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wangun
      POSTGRES_PASSWORD: wangun_dev
      POSTGRES_DB: wangun_db
    ports:
      - "5432:5432"
    volumes:
      - wangun_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wangun -d wangun_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wangun_postgres_data:
